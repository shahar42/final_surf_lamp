[pytest]
testpaths = tests
markers =
    unit: Pure logic tests, no network, no DB, no Redis. Milliseconds.
    integration: Flask test client + SQLite + fake Redis. Seconds.
    firmware: C++ compiled natively with g++ + Arduino shim. Requires g++.
    slow: Tests that take more than a few seconds.
pythonpath =
    web_and_database
    surf-lamp-processor
    .
