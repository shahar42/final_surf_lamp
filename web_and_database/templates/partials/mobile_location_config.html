{# templates/partials/mobile_location_config.html #}
{# Mobile-optimized location and threshold settings #}

<div class="card rounded-2xl p-5 shadow-2xl space-y-5">
    <!-- Location Selector -->
    <div class="space-y-2">
        <label class="text-white/80 text-sm font-medium">Your Location</label>
        <select id="locationSelectMobile" aria-label="Select your location" class="w-full bg-white/20 text-white rounded-lg px-4 py-3 border border-white/30 text-base font-semibold">
            {% for location in locations %}
                <option value="{{ location }}" {% if location == data.user.location %}selected{% endif %}>
                    {{ location.replace(', Israel', '') }}
                </option>
            {% endfor %}
        </select>
        <div id="location-status-mobile" class="text-sm text-white/80"></div>
    </div>

    <!-- Perfect Waves Range Slider -->
    <div class="space-y-3 pt-3 border-t border-white/20">
        <div class="flex justify-between items-center">
            <span class="text-white/80 text-sm font-medium">Perfect Waves</span>
            <span id="waveRangeDisplayMobile" class="text-cyan-400 text-sm font-semibold">--</span>
        </div>
        <div class="px-1 py-3">
            <div id="waveSliderMobile" class="my-2"></div>
        </div>
        <div id="threshold-status-mobile" class="text-sm text-white/80"></div>
    </div>

    <!-- Perfect Wind Range Slider -->
    <div class="space-y-3 pt-3 border-t border-white/20">
        <div class="flex justify-between items-center">
            <span class="text-white/80 text-sm font-medium">Perfect Wind</span>
            <span id="windRangeDisplayMobile" class="text-cyan-400 text-sm font-semibold">--</span>
        </div>
        <div class="px-1 py-3">
            <div id="windSliderMobile" class="my-2"></div>
        </div>
        <div id="wind-threshold-status-mobile" class="text-sm text-white/80"></div>
    </div>

    <!-- Units Toggle -->
    <div class="flex justify-between items-center pt-3 border-t border-white/20">
        <span class="text-white/80 text-sm font-medium">Display Units</span>
        <button id="unitToggleMobile" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg text-sm text-white font-semibold transition-colors">
            {% if data.user.preferred_output == 'feet' %}Switch to Meters{% else %}Switch to Feet{% endif %}
        </button>
    </div>
    <div id="unit-status-mobile" class="text-sm text-white/80"></div>
</div>

<!-- Hidden inputs for threshold values (shared with desktop) -->
<input type="hidden" id="waveThresholdMinMobile"
       value="{% if data.user.preferred_output == 'feet' %}{{ '%.1f'|format((data.user.wave_threshold_m if data.user.wave_threshold_m is not none else 0.0) * 3.28084) }}{% else %}{{ data.user.wave_threshold_m if data.user.wave_threshold_m is not none else 0.0 }}{% endif %}"
       data-unit="{{ data.user.preferred_output or 'meters' }}">
<input type="hidden" id="waveThresholdMaxMobile"
       value="{% if data.user.wave_threshold_max_m %}{% if data.user.preferred_output == 'feet' %}{{ '%.1f'|format(data.user.wave_threshold_max_m * 3.28084) }}{% else %}{{ data.user.wave_threshold_max_m }}{% endif %}{% endif %}">
<input type="hidden" id="windThresholdMinMobile" value="{{ data.user.wind_threshold_knots or 22 }}">
<input type="hidden" id="windThresholdMaxMobile" value="{% if data.user.wind_threshold_max_knots %}{{ data.user.wind_threshold_max_knots }}{% endif %}">
