{# templates/partials/quick_actions.html #}

<div class="max-w-6xl mx-auto mt-4 px-2 lg:px-0">
    <!-- Main Actions Container -->
    <div class="card rounded-3xl shadow-2xl overflow-hidden p-8 card-enter card-enter-5">
        <div class="text-center mb-8">
            <h2 class="text-xl font-bold text-white mb-2">Device Support</h2>
            <p class="text-sm text-white/40 font-medium">Manage your lamp hardware and reporting</p>
        </div>

        <!-- Actions Content -->
        <div class="flex flex-col gap-4 max-w-md mx-auto">
                <a href="{{ url_for('dashboard.wifi_setup_guide') }}" class="flex items-center justify-between bg-white/5 hover:bg-white/10 text-white font-bold py-4 px-6 rounded-2xl border border-white/5 transition-all active:scale-[0.98] group">
                    <span class="flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 mr-3 text-blue-400">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" />
                        </svg>
                        WiFi Setup Guide
                    </span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-white/20 group-hover:text-white/40 transition-colors">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </a>

                <button id="reportErrorBtn" class="flex items-center justify-between bg-white/5 hover:bg-white/10 text-white font-bold py-4 px-6 rounded-2xl border border-white/5 transition-all active:scale-[0.98] group">
                    <span class="flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 mr-3 text-red-400">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
                        </svg>
                        Report an Issue
                    </span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-white/20 group-hover:text-white/40 transition-colors">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </button>

                {% if data.user.is_admin %}
                <div class="pt-6 mt-2 border-t border-white/10 space-y-4">
                    <p class="text-[10px] font-bold text-white/30 uppercase tracking-[0.2em] text-center mb-4">Admin Tools</p>
                    <div class="grid grid-cols-3 gap-2">
                        <a href="{{ url_for('admin.arduino_monitor') }}" class="bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 font-bold py-3 px-2 rounded-xl border border-purple-500/20 transition-all text-center text-[10px] active:scale-95">
                            Monitor
                        </a>
                        <a href="{{ url_for('admin.admin_stats') }}" class="bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 font-bold py-3 px-2 rounded-xl border border-blue-500/20 transition-all text-center text-[10px] active:scale-95">
                            Live Stats
                        </a>
                        <a href="{{ url_for('admin.admin_broadcast') }}" class="bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 font-bold py-3 px-2 rounded-xl border border-purple-500/20 transition-all text-center text-[10px] active:scale-95">
                            Broadcast
                        </a>
                    </div>
                </div>
                {% endif %}
        </div>
    </div>

    <!-- Admin Only: LED Error Codes (Shared) -->
    {% if data.user.is_admin %}
    <button id="errorCodesBtn" onclick="ModalManager.open('errorCodesDrawer')" class="card rounded-3xl shadow-2xl p-6 w-full bg-white/5 hover:bg-white/10 transition-all text-left mt-6 border border-white/5 active:scale-[0.99]">
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-lg font-bold text-white">LED Error Codes</h2>
                <p class="text-xs text-white/40 font-medium">Reference for on-device diagnostics</p>
            </div>
            <div class="bg-white/5 p-2 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-white/40">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                </svg>
            </div>
        </div>
    </button>
    {% endif %}
</div>
