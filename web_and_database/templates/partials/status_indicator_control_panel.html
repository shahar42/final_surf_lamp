{# templates/partials/status_indicator_control_panel.html #}
<div id="statusIndicatorControlPanel" class="fixed bottom-20 right-4 z-50 hidden">
    <div class="bg-gray-900/95 backdrop-blur-lg rounded-xl shadow-2xl p-6 w-80 border border-orange-500/30">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-white/20">
            <h3 class="text-white font-bold text-lg">Status Indicator</h3>
            <button onclick="toggleStatusIndicatorPanel()" class="text-white/70 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Position Controls -->
        <div class="space-y-4">
            <div>
                <label class="text-white/70 text-xs">Top: <span id="statusTopVal">0</span>px</label>
                <input type="range" id="statusTop" min="-20" max="20" value="0" class="w-full">
            </div>
            <div>
                <label class="text-white/70 text-xs">Right: <span id="statusRightVal">0</span>px</label>
                <input type="range" id="statusRight" min="-20" max="20" value="0" class="w-full">
            </div>
        </div>

        <div class="mt-4 p-3 bg-orange-400/10 rounded border border-orange-400/30 text-xs text-orange-300">
            Adjust position to match layout
        </div>
    </div>
</div>

<!-- Toggle Button for Control Panel -->
<button id="statusIndicatorToggleBtn" onclick="toggleStatusIndicatorPanel()" class="fixed bottom-4 right-4 z-40 bg-orange-600 hover:bg-orange-700 text-white p-3 rounded-full shadow-lg transition-all">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
    </svg>
</button>
